name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/deploy-cloudflare.yml"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy social-hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API deps
        working-directory: apps/api
        run: npm ci

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Build admin SPA into Worker assets
        run: |
          VITE_BASE=/admin/ npm run build --prefix apps/web
          rm -rf apps/api/public/admin
          cp -r apps/web/dist apps/api/public/admin
          test -f apps/api/public/admin/index.html

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
