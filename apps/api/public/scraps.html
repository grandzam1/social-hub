<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Saved Scraps — Social Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/ui.css?v=25" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("social-hub.theme");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div id="creditsBackdrop" class="credits-backdrop" hidden></div>
    <aside id="creditsPanel" class="credits-panel" hidden aria-label="Credit charge history">
      <div class="credits-panel-head">
        <h2>Charge history</h2>
        <button type="button" id="creditsClose" class="credits-close" aria-label="Close">×</button>
      </div>
      <div id="creditsHistory" class="credits-history"></div>
    </aside>
    <main class="shell shell-wide">
      <nav class="topnav">
        <div class="topnav-links">
          <a href="/">Pull media</a>
          <a href="/batch">Batch</a>
          <a href="/scraps" aria-current="page">Saved Scraps</a>
          <a href="/docs/api">API</a>
        </div>
        <div class="topnav-actions">
          <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            aria-pressed="false"
            aria-label="Switch to dark theme"
            data-theme="light"
          >
            <span class="theme-toggle-icon" aria-hidden="true"></span>
            <span class="theme-toggle-label">Dark</span>
          </button>
          <button
            type="button"
            id="creditsBar"
            class="credits-bar"
            aria-expanded="false"
            aria-controls="creditsPanel"
          >
            <span class="credits-chip">remaining —</span>
          </button>
        </div>
      </nav>

      <header class="mast">
        <p class="mark">Your library</p>
        <h1>Saved Scraps</h1>
        <p class="lede">
          Posts keep image, video, and text together. Filter from the side rail —
          media playback prefs live under Media.
        </p>
      </header>

      <div class="lib-shell">
        <aside class="lib-rail" aria-label="Library controls">
          <div class="subtabs" role="tablist" aria-label="Library panels">
            <button
              type="button"
              class="subtab is-active"
              role="tab"
              id="tabBrowse"
              aria-selected="true"
              aria-controls="panelBrowse"
              data-panel="browse"
            >
              Browse
            </button>
            <button
              type="button"
              class="subtab"
              role="tab"
              id="tabSettings"
              aria-selected="false"
              aria-controls="panelSettings"
              data-panel="settings"
            >
              Media
            </button>
          </div>

          <div
            id="panelBrowse"
            class="rail-panel"
            role="tabpanel"
            aria-labelledby="tabBrowse"
          >
            <p class="rail-label">Type</p>
            <div class="type-tabs" role="tablist" aria-label="Media type">
              <button type="button" class="tab is-active" data-type="all">All</button>
              <button type="button" class="tab" data-type="text">Text</button>
              <button type="button" class="tab" data-type="image">Images</button>
              <button type="button" class="tab" data-type="video">Videos</button>
            </div>

            <p class="rail-label">Filter</p>
            <label class="field-label" for="userFilter">User</label>
            <select id="userFilter" class="select field-control">
              <option value="all">All users</option>
            </select>

            <label class="field-label" for="search">Search</label>
            <input
              id="search"
              class="search field-control"
              type="search"
              placeholder="Search text or @user…"
              autocomplete="off"
              enterkeyhint="search"
            />
          </div>

          <div
            id="panelSettings"
            class="rail-panel"
            role="tabpanel"
            aria-labelledby="tabSettings"
            hidden
          >
            <p class="rail-label">Playback</p>
            <label class="setting-row" for="autoplayVideos">
              <span class="setting-copy">
                <span class="setting-title">Autoplay videos</span>
                <span class="setting-hint"
                  >Muted previews when a clip scrolls into view. Off by
                  default.</span
                >
              </span>
              <input
                id="autoplayVideos"
                class="setting-switch"
                type="checkbox"
                role="switch"
              />
            </label>
          </div>
        </aside>

        <div class="lib-main">
          <p id="libStatus" class="status">Loading scraps…</p>
          <section id="grid" class="scrap-grid scrap-feed" aria-live="polite"></section>
          <p id="empty" class="empty" hidden>
            Nothing here yet. <a href="/">Pull a post</a> to start your library.
          </p>
        </div>
      </div>
    </main>
    <script src="/theme.js?v=24"></script>
    <script src="/media-settings.js?v=24"></script>
    <script src="/credits.js?v=24"></script>
    <script src="/scraps.js?v=25"></script>
  </body>
</html>
